<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>날씨 확인</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <h1>오늘의 날씨</h1>

    <form id="weather-form">
      <input id="city-input" type="text" placeholder="도시 이름 (예: 서울, Tokyo)" autocomplete="off" />
      <button type="submit">날씨 확인</button>
    </form>

    <p id="message" class="message"></p>

    <section id="result" class="result hidden">
      <div class="icon" id="icon"></div>
      <h2 id="city-name"></h2>
      <p class="temp" id="temperature"></p>
      <p class="desc" id="description"></p>
      <ul class="details">
        <li>체감 온도 <strong id="feels-like"></strong></li>
        <li>습도 <strong id="humidity"></strong></li>
        <li>풍속 <strong id="wind"></strong></li>
      </ul>
      <p class="time" id="time"></p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
